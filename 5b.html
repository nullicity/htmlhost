<!DOCTYPE html>
<html lang="en">
<head>
	<base href="https://cdn.jsdelivr.net/gh/coppersalts/HTML5b@master/">
	<title>HTML5b - Battle for Dream Island</title>
	<link rel="stylesheet" href="style.css" type="text/css"/>
	<script type="text/javascript" src="5b.js"></script>

	<style>
		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #111;
		}

		#center {
			width: 100vw;
			height: 100vh;

			display: flex;
			align-items: center;
			justify-content: center;
		}

		#hide-contenteditable {
			width: 100%;
			height: 100%;

			display: flex;
			align-items: center;
			justify-content: center;
		}

		#cnv {
			max-width: 100vw;
			max-height: 100vh;

			width: auto;
			height: auto;

			object-fit: contain;
		}
	</style>
</head>

<body>
	<div id="center">
		<div id="hide-contenteditable">
			<canvas id="cnv" contenteditable="false"></canvas>
		</div>
	</div>
</body>
</html>
