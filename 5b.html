<!DOCTYPE html>

<html lang="en">
<head>
	<base href="https://cdn.jsdelivr.net/gh/coppersalts/HTML5b@master/">
	<title>HTML5b - Battle for Dream Island</title>
	<link rel="stylesheet" href="style.css" type="text/css"/>
	<script type="text/javascript" src="5b.js"></script>

<style>
	html, body {
		margin: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #111;
	}

	#center {
		position: relative;

		width: 100vw;
		height: 100vh;

		display: flex;
		align-items: center;
		justify-content: center;
	}

	#loading {
		position: absolute;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);

		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;

		color: #aaa;
		font-family: Arial, sans-serif;
		font-size: 16px;

		z-index: 0;
		text-align: center;
	}

	#loading-spinner {
		width: 38px;
		height: 38px;

		margin-bottom: 12px;

		border: 4px solid #333;
		border-top-color: #aaa;
		border-radius: 50%;

		animation: loading-spin 0.9s linear infinite;
	}

	@keyframes loading-spin {
		to {
			transform: rotate(360deg);
		}
	}

	#loading-text {
		line-height: 1.5;
	}

	#hide-contenteditable {
		position: relative;

		width: 100%;
		height: 100%;

		display: flex;
		align-items: center;
		justify-content: center;

		z-index: 1;
	}

	#cnv {
		max-width: 100vw;
		max-height: 100vh;

		width: auto;
		height: auto;

		object-fit: contain;
	}
</style>

</head>

<body>
	<div id="center">

	<div id="loading">
		<div id="loading-spinner"></div>

		<div id="loading-text">
			Loading <b>BFDIA 5b</b>...<br>
			This may take a while.
		</div>
	</div>

	<div id="hide-contenteditable">
		<canvas id="cnv" contenteditable="false"></canvas>
	</div>

</div>

</body>
</html>
